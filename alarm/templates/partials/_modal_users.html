  <!-- User Management Modal (Admin Only) -->
  <div id="usersModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="usersModalTitle">
    <div class="modal-card modal-card-xl">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span id="usersModalTitle" class="modal-title">User Management</span>
        </div>
        <button id="closeUsersModalBtn" class="modal-close" type="button" aria-label="Close user management dialog">&times;</button>
      </div>
      <div class="modal-body" style="padding: 20px;">
        <!-- Users List Section -->
        <div style="margin-bottom: 20px;">
          <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Existing Users</div>
          <div id="usersListContainer" style="max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface);">
            <div style="padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px;">Loading users...</div>
          </div>
        </div>

        <div class="user-dropdown-divider" style="margin: 16px 0;"></div>

        <!-- Add User Section -->
        <div>
          <div style="font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">Create New User</div>
          <form id="createUserForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
              <div class="form-group">
                <label for="newUsernameInput" class="form-label">Username</label>
                <input type="text" id="newUsernameInput" class="form-input" style="width: 100%;" placeholder="e.g. operator1" required autocomplete="off">
              </div>
              <div class="form-group">
                <label for="newDisplayNameInput" class="form-label">Display Name</label>
                <input type="text" id="newDisplayNameInput" class="form-input" style="width: 100%;" placeholder="e.g. John Doe" autocomplete="off">
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
              <div class="form-group">
                <label for="newPasswordInput" class="form-label">Password (min 12 chars)</label>
                <input type="password" id="newPasswordInput" class="form-input" style="width: 100%;" placeholder="••••••••••••" required minlength="12" autocomplete="new-password">
              </div>
              <div class="form-group">
                <label for="newRoleSelect" class="form-label">Role</label>
                <select id="newRoleSelect" class="form-select">
                  <option value="viewer">Viewer (Read-Only NOC Wallboard)</option>
                  <option value="admin">Admin (Full Control)</option>
                </select>
              </div>
            </div>
            <div id="createUserError" class="form-error hidden" style="margin-bottom: 12px;"></div>
            <div id="createUserSuccess" class="form-success hidden" style="margin-bottom: 12px;"></div>
            <div class="modal-actions" style="margin-top: 0;">
              <button id="cancelUsersModalBtn" class="btn btn-secondary" type="button">Close</button>
              <button type="submit" id="createUserSubmitBtn" class="btn btn-primary">Add User</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
