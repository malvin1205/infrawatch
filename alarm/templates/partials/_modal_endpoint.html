  <!-- Endpoint Management Modal -->
  <div id="endpointModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="endpointModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="endpointModalTitle">Manage Prometheus Endpoints</h3>
        <button id="closeEndpointModalBtn" class="modal-close" type="button" aria-label="Close modal">&times;</button>
      </div>

      <div class="modal-body">
        <form id="addEndpointForm" style="margin-bottom: 20px;">
          <div class="form-group">
            <label for="endpointUrlInput" class="form-label">New Prometheus Endpoint URL</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="endpointUrlInput" class="form-input" style="flex: 1;" placeholder="http://192.168.10.5:9090" required>
              <button type="submit" class="add-target-btn" style="padding: 0 14px; flex-shrink: 0;">
                <span>+ Add</span>
              </button>
            </div>
            <div id="addEndpointError" class="form-error hidden" style="margin-top: 6px;"></div>
          </div>
        </form>

        <div style="border-top: 1px solid var(--border); padding-top: 14px;">
          <div style="font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;">Registered Endpoints:</div>
          <div id="endpointListContainer" style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>
    </div>
  </div>
